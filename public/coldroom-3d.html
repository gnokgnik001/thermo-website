<style>
  :root{
    --navy:#0B2E5F; --blue:#1E73BE; --green:#2BB673; --bg:#F5F8FC;

  html,body{height:100%}
  body{
    font-family:'Noto Sans Thai','Segoe UI',system-ui,sans-serif;

      radial-gradient(1200px 500px at 80% -10%, rgba(30,115,190,.14), transparent 60%),

  /* เงาโรงงานเบลอๆ ด้านหลัง */
  .backdrop{position:fixed;inset:0;pointer-events:none;opacity:.5}
  .backdrop::before,.backdrop::after{
    content:"";position:absolute;border-radius:14px;filter:blur(26px);
    background:linear-gradient(180deg, rgba(11,46,95,.10), rgba(11,46,95,.02));
  }
  .backdrop::before{left:-4%;bottom:6%;width:30%;height:52%}
  .backdrop::after{right:-5%;bottom:10%;width:34%;height:44%;background:linear-gradient(180deg, rgba(30,115,190,.10), rgba(30,115,190,.02))}

  #stage{position:fixed;inset:0}
  canvas{display:block}

  .hint{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    background:rgba(255,255,255,.72);backdrop-filter:blur(10px);
    border:1px solid rgba(30,115,190,.25);color:var(--navy);
    padding:9px 18px;border-radius:999px;font-size:13px;font-weight:600;
    box-shadow:0 8px 26px rgba(11,46,95,.12);opacity:0;transition:opacity .6s;
    white-space:nowrap;z-index:5;
  }
  .hint.show{opacity:1}
  .hint .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:8px;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  /* เส้นโยงจากชิ้นส่วนไป tooltip */
  #wire{position:fixed;inset:0;pointer-events:none;z-index:6}

  @keyframes dash{to{stroke-dashoffset:-18}}
  #wire circle{fill:var(--blue);opacity:0;transition:opacity .25s}

  /* การ์ด tooltip แบบ glass */
  .tip{
    position:fixed;z-index:7;width:min(300px,72vw);pointer-events:none;
    background:rgba(255,255,255,.78);backdrop-filter:blur(14px);
    border:1px solid rgba(30,115,190,.28);border-radius:14px;
    box-shadow:0 16px 44px rgba(11,46,95,.18);
    padding:14px 16px;opacity:0;transform:translateY(6px) scale(.98);

  }
  .tip.show{opacity:1;transform:none;pointer-events:auto}
  .tip h3{font-size:15px;margin-bottom:4px}
  .tip p{font-size:12.5px;color:rgba(11,46,95,.75);line-height:1.55;margin-bottom:8px}
  .tip ul{list-style:none;margin-bottom:10px}
  .tip li{font-size:12px;color:rgba(11,46,95,.85);padding-left:16px;position:relative;line-height:1.6}
  .tip li::before{content:"";position:absolute;left:2px;top:7px;width:6px;height:6px;border-radius:50%;background:var(--green)}
  .tip button{
    pointer-events:auto;cursor:pointer;border:0;border-radius:999px;
    background:var(--blue);color:#fff;font-size:12px;font-weight:700;
    padding:7px 14px;font-family:inherit;transition:background .2s;

  /* modal รายละเอียดเต็ม */

  .modal h4::before{content:"";width:18px;height:2px;background:var(--green);border-radius:2px}
  .modal ul{list-style:none}
  .modal li{font-size:13.5px;line-height:1.7;padding-left:18px;position:relative;color:rgba(11,46,95,.88)}
  .modal li::before{content:"";position:absolute;left:2px;top:9px;width:7px;height:7px;border-radius:50%;background:var(--green)}
  .modal .maint{font-size:13.5px;line-height:1.7;color:rgba(11,46,95,.88);
    background:rgba(43,182,115,.08);border:1px solid rgba(43,182,115,.25);
    border-radius:12px;padding:12px 14px}
  .modal .close{
    position:sticky;top:0;float:right;cursor:pointer;border:0;background:rgba(11,46,95,.06);
    color:var(--navy);width:34px;height:34px;border-radius:50%;font-size:17px;font-weight:700;
    transition:background .2s;font-family:inherit;
  }
  .modal .close:hover{background:rgba(11,46,95,.14)}

  /* ปุ่มซ่อนสำหรับคีย์บอร์ด/screen reader */
  .a11y{position:fixed;left:10px;top:10px;z-index:8;display:flex;flex-direction:column;gap:4px}
  .a11y button{
    font-family:inherit;font-size:11px;font-weight:600;color:var(--navy);
    background:rgba(255,255,255,.85);border:1px solid rgba(30,115,190,.3);
    border-radius:8px;padding:5px 10px;cursor:pointer;
    opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .a11y button:focus-visible{opacity:1;pointer-events:auto;outline:2px solid var(--blue)}

  @media (prefers-reduced-motion: reduce){
    .tip,.modal,.modal-bg{transition:none}
    #wire line{animation:none}
  }
  .nowebgl{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    font-size:15px;color:var(--navy);text-align:center;padding:30px}
</style>
</head>

<script>
addEventListener('error', e=>{
  const d=document.getElementById('err');
  if(d && d.style.display==='none'){ d.style.display='block'; d.textContent='3D error: '+(e.message||e.type)+' @'+(e.filename||'')+':'+(e.lineno||''); }
});
</script>

try {
  const c = document.createElement('canvas');
  if (!(c.getContext('webgl2') || c.getContext('webgl'))) throw 0;
} catch {
  document.getElementById('nowebgl').style.display='flex';
  document.getElementById('nowebgl').textContent = T.ui.webglFail;
  throw new Error('no webgl');
}

/* ─── ฉาก ─── */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;   // โทนสีแบบงาน render
renderer.toneMappingExposure = 1.06;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
/* แสงสะท้อนรอบทิศแบบห้องสตูดิโอ — ทำให้วัสดุมันวาวดูมีมิติแบบภาพ render */
{
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), .04).texture;
}
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, .1, 100);
const CAM_BASE = new THREE.Vector3(8.6, 4.3, 9.7);
camera.position.copy(CAM_BASE);
camera.lookAt(0.4, 1.3, 0);

/* แสง — โทนอุตสาหกรรมฟ้าเย็น */
scene.add(new THREE.HemisphereLight(0xeaf3ff, 0xb9c8dc, .55));
const sun = new THREE.DirectionalLight(0xffffff, 1.25);
sun.position.set(7, 11, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left=-9; sun.shadow.camera.right=9;
sun.shadow.camera.top=9;   sun.shadow.camera.bottom=-9;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x9cc4ff, .5);
fill.position.set(-6, 4, -5); scene.add(fill);

/* พื้นรับเงา */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(14, 48),
  new THREE.ShadowMaterial({opacity:.16})
);
ground.rotation.x = -Math.PI/2; ground.position.y = -0.02;
ground.receiveShadow = true; scene.add(ground);
const disc = new THREE.Mesh(
  new THREE.CircleGeometry(9.5, 48),
  new THREE.MeshStandardMaterial({color:0xe7eef7, roughness:.95})
);
disc.rotation.x=-Math.PI/2; disc.position.y=-0.03; scene.add(disc);

/* ─── วัสดุ ─── */
const phys = o => new THREE.MeshPhysicalMaterial(Object.assign({envMapIntensity:.85}, o));
const M = {
  panel : phys({color:0xf5f8fc, roughness:.3,  metalness:.1,  clearcoat:.5, clearcoatRoughness:.4}),
  panel2: phys({color:0xe9eef6, roughness:.36, metalness:.1,  clearcoat:.4, clearcoatRoughness:.45}),
  floor : phys({color:0x1fa561, roughness:.16, metalness:.05, clearcoat:.75, clearcoatRoughness:.22, envMapIntensity:1.05}),  // พื้น epoxy เขียวเงา
  door  : phys({color:0xdfe9f4, roughness:.24, metalness:.35, clearcoat:.6, clearcoatRoughness:.3}),
  frame : phys({color:0x0B2E5F, roughness:.4,  metalness:.5}),
  unit  : phys({color:0xf1f4f9, roughness:.28, metalness:.4,  clearcoat:.5, clearcoatRoughness:.35}),
  dark  : phys({color:0x22354f, roughness:.55, metalness:.3}),
  fan   : phys({color:0x101d31, roughness:.45, metalness:.4}),
  copper: phys({color:0xc9803f, roughness:.22, metalness:.95}),
  ctrl  : phys({color:0x1E73BE, roughness:.34, metalness:.35, clearcoat:.5, clearcoatRoughness:.3}),
  green : new THREE.MeshStandardMaterial({color:0x2BB673, emissive:0x2BB673, emissiveIntensity:.9})
};
/* กล่องขอบมน — ของจริงไม่มีขอบคม ทำให้แสงเกาะขอบเหมือนภาพ render */
const box = (w,h,d,mat)=>{
  const r = Math.min(.035, Math.min(w,h,d)*.14);
  const m = new THREE.Mesh(new RoundedBoxGeometry(w,h,d,3,r), mat);
  m.castShadow = m.receiveShadow = true; return m;
};
const cyl = (r,h,mat,seg=24)=>{ const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg),mat); m.castShadow=true; return m; };

/* ─── ประกอบห้องเย็น (กว้าง 6 ลึก 4 สูง 2.8, เปิดผนังหน้า-ขวาให้เห็นข้างใน) ─── */
const parts = {};                       // id -> {group, meta, flyFrom, order}
const root = new THREE.Group(); scene.add(root);
const t = 0.16;                          // ความหนาแผ่น
const W=6, D=4, H=2.8;

function register(id, group, flyFrom, order, anchor){
  group.userData.id = id;
  root.add(group);
  parts[id] = {group, flyFrom, order, anchor: anchor || new THREE.Vector3(), home: group.position.clone(), t0:0, done:false};
  group.traverse(o=>{ if(o.isMesh) o.userData.pid = id; });
}

/* พื้น */
{
  const g = new THREE.Group();
  const slab = box(W, t, D, M.floor); slab.position.set(0, t/2, 0); g.add(slab);
  register('floor', g, new THREE.Vector3(0,-6,0), 1, new THREE.Vector3(1.6, .3, 1.2));
}
/* ผนัง (หลัง + ซ้าย + หน้าซีกซ้ายสั้นๆ) */
{
  const g = new THREE.Group();
  const back = box(W, H, t, M.panel);  back.position.set(0, t+H/2, -D/2 + t/2); g.add(back);
  const left = box(t, H, D, M.panel2); left.position.set(-W/2 + t/2, t+H/2, 0); g.add(left);
  const frontL = box(1.6, H, t, M.panel); frontL.position.set(-W/2+0.8+t, t+H/2, D/2 - t/2); g.add(frontL);
  // เส้นร่องแผ่น — ผนังหลังถี่ขึ้น + เพิ่มผนังซ้าย
  for(let i=1;i<8;i++){
    const seam = box(0.016, H*0.97, 0.016, M.panel2);
    seam.position.set(-W/2 + i*(W/8), t+H/2, -D/2 + t + 0.002); g.add(seam);
  }
  for(let i=1;i<6;i++){
    const seam = box(0.016, H*0.97, 0.016, M.panel);
    seam.position.set(-W/2 + t + 0.002, t+H/2, -D/2 + i*(D/6)); g.add(seam);
  }
  register('panels', g, new THREE.Vector3(-9,2,-6), 0, new THREE.Vector3(-2.4, 1.6, -1));
}
/* เพดาน */
{
  const g = new THREE.Group();
  // เพดานคลุมเฉพาะฝั่งซ้าย (section cut) — เปิดมุมมองให้เห็นอีวาปอเรเตอร์ข้างใน
  const lid = box(W*0.62, t, D, M.panel2); lid.position.set(-W*0.19, t+H+t/2, 0); g.add(lid);
  register('ceiling', g, new THREE.Vector3(0,8,0), 2, new THREE.Vector3(-1.1, 3.15, 0));
}
/* ประตู (บนผนังหน้า ถัดจากซีกซ้าย) */
{
  const g = new THREE.Group();
  const fr = box(1.5, 2.35, .1, M.frame); fr.position.set(-0.55, t+2.35/2, D/2 - .04); g.add(fr);
  const leaf = box(1.26, 2.1, .12, M.door); leaf.position.set(-0.55, t+2.1/2+.04, D/2 + .02); g.add(leaf);
  const handle = box(.06, .5, .06, M.frame); handle.position.set(-0.05, t+1.15, D/2 + .1); g.add(handle);
  register('door', g, new THREE.Vector3(0,1.4,7), 3, new THREE.Vector3(-0.55, 1.4, 2.4));
}
/* อีวาปอเรเตอร์ (แขวนใต้เพดาน ชิดผนังหลัง) */
{
  const g = new THREE.Group();
  const body = box(2.4, .62, .85, M.unit); body.position.set(-1.15, t+H-0.48, -D/2 + .85); g.add(body);
  const tray = box(2.3, .05, .92, M.dark); tray.position.set(-1.15, t+H-0.83, -D/2 + .85); g.add(tray);
  for(const dx of [-0.75, 0, 0.75]){
    const f = cyl(.2, .07, M.fan); f.rotation.x = Math.PI/2;
    f.position.set(-1.15+dx, t+H-0.48, -D/2 + .85 + .47); g.add(f);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(.22, .022, 10, 28), M.dark);
    ring.position.set(-1.15+dx, t+H-0.48, -D/2 + .85 + .5); g.add(ring);
  }
  register('evaporator', g, new THREE.Vector3(-2,6,-4), 4, new THREE.Vector3(-1.15, 2.5, -0.3));
}
/* ท่อน้ำยา (จากอีวาปฯ ทะลุผนังหลัง ไปหน่วยนอก) */
{
  const g = new THREE.Group();
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0.4, t+H-0.5, -D/2+0.75),
    new THREE.Vector3(1.2, t+H-0.35, -D/2-0.1),
    new THREE.Vector3(2.9, 1.8, -D/2-0.85),
    new THREE.Vector3(3.7, 1.45, -1.0)
  ]);
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 40, .05, 10), M.copper);
  tube.castShadow = true; g.add(tube);
  register('piping', g, new THREE.Vector3(8,6,-6), 5, new THREE.Vector3(2.9, 1.9, -2.2));
}
/* คอนเดนซิ่งยูนิต (นอกห้อง ด้านขวา) */
{
  const g = new THREE.Group();
  const stand = phys({color:0x5cbf7a, roughness:.5, metalness:.2});      // ขาตั้งเขียวแบบงานจริง
  const comp  = phys({color:0x7fae83, roughness:.42, metalness:.45});    // เขียวคอมเพรสเซอร์
  // โต๊ะขาตั้ง
  const top = box(1.9, .07, 1.05, stand); top.position.set(4.2, .82, -0.9); g.add(top);
  for(const [lx,lz] of [[-0.82,-0.42],[0.82,-0.42],[-0.82,0.42],[0.82,0.42]]){
    const leg = box(.08, .82, .08, stand); leg.position.set(4.2+lx, .41, -0.9+lz); g.add(leg);
  }
  // คอยล์ระบายความร้อน (แผงดำ + พัดลมใหญ่)
  const coil = box(1.05, .95, .14, M.dark); coil.position.set(4.55, 1.38, -0.9); coil.rotation.y = Math.PI/2; g.add(coil);
  const bigFan = cyl(.36, .05, M.fan); bigFan.rotation.z = Math.PI/2; bigFan.position.set(4.46, 1.4, -0.9); g.add(bigFan);
  const fanRing = new THREE.Mesh(new THREE.TorusGeometry(.38, .026, 10, 30), M.unit);
  fanRing.rotation.y = Math.PI/2; fanRing.position.set(4.45, 1.4, -0.9); g.add(fanRing);
  // ตัวคอมเพรสเซอร์ (บล็อกครีบ + หัวกลม) + ถังพักน้ำยาแนวนอน
  const body = box(.62, .34, .38, comp); body.position.set(3.85, 1.2, -0.9); g.add(body);
  for(let i=0;i<5;i++){ const rib = box(.62, .028, .42, comp); rib.position.set(3.85, 1.07+i*.065, -0.9); g.add(rib); }
  const head = cyl(.17, .2, comp); head.rotation.z = Math.PI/2; head.position.set(3.52, 1.2, -0.9); g.add(head);
  const tank = cyl(.13, .6, comp); tank.rotation.z = Math.PI/2; tank.position.set(3.85, .95, -0.55); g.add(tank);
  // ท่อทองแดงจากคอมเพรสเซอร์เข้าไปหลังคอยล์
  const cCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(3.6, 1.35, -0.9), new THREE.Vector3(3.7, 1.72, -0.95), new THREE.Vector3(4.4, 1.8, -0.95), new THREE.Vector3(4.55, 1.6, -0.9)
  ]);
  const cPipe = new THREE.Mesh(new THREE.TubeGeometry(cCurve, 24, .035, 8), M.copper); cPipe.castShadow=true; g.add(cPipe);
  register('condensing', g, new THREE.Vector3(11,1,2), 6, new THREE.Vector3(4.2, 2.0, -0.5));
}
/* ตู้ควบคุม (ติดผนังหน้าซีกซ้าย ด้านนอก) */
{
  const g = new THREE.Group();
  const cab = box(.55, .8, .16, M.ctrl); cab.position.set(-2.15, t+1.55, D/2 + .1); g.add(cab);
  const lamp = cyl(.035, .03, M.green); lamp.rotation.x=Math.PI/2; lamp.position.set(-2.32, t+1.82, D/2 + .19); g.add(lamp);
  const scr = box(.3, .16, .02, M.dark); scr.position.set(-2.1, t+1.68, D/2 + .19); g.add(scr);
  register('control', g, new THREE.Vector3(-8,1.5,6), 7, new THREE.Vector3(-2.15, 1.95, 2.4));
}

/* ─── ของประกอบฉาก (ไม่ใช่ hotspot — โผล่หลังประกอบเสร็จ) ─── */
let propsGroup;
{
  propsGroup = new THREE.Group(); propsGroup.visible = false; root.add(propsGroup);
  const palletM = phys({color:0x2a4d8f, roughness:.7});
  const crate1 = phys({color:0xb08a5a, roughness:.85});
  const crate2 = phys({color:0xc79a6b, roughness:.85});
  const stack = (x,z,h)=>{
    const pl = box(.95,.1,.95,palletM); pl.position.set(x, t+.05, z); propsGroup.add(pl);
    let y = t+.1;
    for(let i=0;i<h;i++){
      const b = box(.88-.04*i, .4, .88-.04*i, i%2?crate2:crate1);
      b.position.set(x, y+.2, z); propsGroup.add(b); y+=.4;
    }
  };
  stack(-2.15, -0.95, 2); stack(-2.15, 0.35, 2); stack(-0.95, -1.15, 1);
  // ไฟ LED เพดาน
  const lampM = new THREE.MeshStandardMaterial({color:0xffffff, emissive:0xffffff, emissiveIntensity:1.6});
  for(const lx of [-2.5, -0.9]){
    const L = box(1.1, .03, .12, lampM); L.position.set(lx, t+H-.02, -0.1); propsGroup.add(L);
  }
}

/* ─── แอนิเมชันประกอบตอนโหลด ─── */
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const STEP = 480, DUR = 900;                       // ms ต่อชิ้น
const ease = x => 1 - Math.pow(1-x, 3);
let assembled = reduced;
if (reduced) propsGroup.visible = true;                            // ลดโมชัน = ข้ามแอนิเมชัน
const startAt = performance.now() + 250;
for (const p of Object.values(parts)){
  if (reduced) continue;
  p.group.position.copy(p.flyFrom);
  p.t0 = startAt + p.order * STEP;
}

/* ─── hotspot / เส้นโยง / tooltip ─── */
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2(9, 9);
const tip = document.getElementById('tip');
const wline = document.getElementById('wline');
const wdot = document.getElementById('wdot');
const hintEl = document.getElementById('hint');
let hoverId = null, lockId = null;                  // lockId = โหมดแตะบนมือถือ
const isTouch = matchMedia('(pointer: coarse)').matches;

function anchorScreen(p){
  const v = p.anchor.clone().add(p.group.position).sub(p.home).project(camera);
  return { x:(v.x*.5+.5)*innerWidth, y:(-v.y*.5+.5)*innerHeight };
}
function showTip(id){
  const c = T.components[id]; if(!c) return;
  tip.innerHTML = `<h3>${c.name}</h3><p>${c.short}</p>
    <ul>${c.advantages.slice(0,3).map(a=>`<li>${a}</li>`).join('')}</ul>
    <button id="tipMore">${T.ui.more} →</button>`;
  document.getElementById('tipMore').onclick = (e)=>{ e.stopPropagation(); openModal(id); };
  const a = anchorScreen(parts[id]);
  const tw = 300, right = a.x + 40 + tw < innerWidth;
  const tx = right ? a.x + 40 : Math.max(10, a.x - 40 - tw);
  const ty = Math.min(Math.max(14, a.y - 70), innerHeight - 240);
  tip.style.left = tx+'px'; tip.style.top = ty+'px';
  tip.classList.add('show');
  wline.setAttribute('x1', a.x); wline.setAttribute('y1', a.y);
  wline.setAttribute('x2', right ? tx : tx+tw); wline.setAttribute('y2', ty+34);
  wdot.setAttribute('cx', a.x); wdot.setAttribute('cy', a.y);
  wline.style.opacity = wdot.style.opacity = 1;
}
function hideTip(){
  tip.classList.remove('show');
  wline.style.opacity = wdot.style.opacity = 0;
}
function setHighlight(id, on){
  if(!parts[id]) return;
  parts[id].group.traverse(o=>{
    if(!o.isMesh) return;
    if(on){
      if(!o.userData.m0) o.userData.m0 = o.material;
      o.material = o.userData.m0.clone();
      o.material.emissive = new THREE.Color(0x1E73BE);
      o.material.emissiveIntensity = .38;
    } else if(o.userData.m0){
      o.material.dispose(); o.material = o.userData.m0;
    }
  });
}

/* ─── modal ─── */
const modalBg = document.getElementById('modalBg');
const modal = document.getElementById('modal');
function openModal(id){
  const c = T.components[id]; if(!c) return;
  modal.innerHTML = `
    <button class="close" aria-label="${T.ui.close}">✕</button>
    <span class="tag">THERMO · COLD ROOM</span>
    <h2>${c.name}</h2>
    <p class="short">${c.short}</p>
    <h4>${T.ui.specs}</h4><ul>${c.specs.map(s=>`<li>${s}</li>`).join('')}</ul>
    <h4>${T.ui.advantages}</h4><ul>${c.advantages.map(s=>`<li>${s}</li>`).join('')}</ul>
    <h4>${T.ui.maintenance}</h4><div class="maint">${c.maintenance}</div>`;
  modal.querySelector('.close').onclick = closeModal;
  modalBg.classList.add('show');
  hideTip();
}
function closeModal(){ modalBg.classList.remove('show'); }
modalBg.addEventListener('click', e=>{ if(e.target===modalBg) closeModal(); });
addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeModal(); if(lockId){setHighlight(lockId,false);lockId=null;hideTip();} }});

/* ─── ปุ่มคีย์บอร์ด (accessibility) ─── */
const a11y = document.getElementById('a11y');
for (const id of Object.keys(parts)){
  const b = document.createElement('button');
  b.textContent = T.components[id].name;
  b.setAttribute('aria-label', T.components[id].name);
  b.addEventListener('focus', ()=>{ setHighlight(id,true); showTip(id); });
  b.addEventListener('blur',  ()=>{ setHighlight(id,false); hideTip(); });
  b.addEventListener('click', ()=> openModal(id));
  a11y.appendChild(b);
}

/* ─── เมาส์ / ทัช ─── */
const mouse = {x:0, y:0};
addEventListener('pointermove', e=>{
  mouse.x = (e.clientX/innerWidth)*2-1;
  mouse.y = (e.clientY/innerHeight)*2-1;
  if(!isTouch){ ndc.x = mouse.x; ndc.y = -mouse.y; }
});
renderer.domElement.addEventListener('click', e=>{
  ndc.x = (e.clientX/innerWidth)*2-1; ndc.y = -((e.clientY/innerHeight)*2-1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(root.children, true)[0];
  const id = hit && hit.object.userData.pid;
  if(!assembled) return;
  if(isTouch){
    if(id && id!==lockId){                 // แตะครั้งแรก = ไฮไลต์ + tooltip
      if(lockId) setHighlight(lockId,false);
      lockId = id; setHighlight(id,true); showTip(id);
    } else if(id && id===lockId){          // แตะซ้ำ = เปิดรายละเอียด
      openModal(id);
    } else if(lockId){                     // แตะที่ว่าง = ปิด
      setHighlight(lockId,false); lockId=null; hideTip();
    }
  } else if(id){
    openModal(id);
  }
});

/* ─── ลูปเรนเดอร์ ─── */
const clock = new THREE.Clock();
function frame(now){
  requestAnimationFrame(frame);
  const el = clock.getElapsedTime();

  // 1) แอนิเมชันประกอบ
  if(!assembled){
    let all = true;
    for(const p of Object.values(parts)){
      if(p.done) continue;
      const k = (now - p.t0)/DUR;
      if(k < 0){ all = false; continue; }
      if(k >= 1){ p.group.position.copy(p.home); p.done = true; continue; }
      all = false;
      p.group.position.lerpVectors(p.flyFrom, p.home, ease(k));
    }
    if(all){
      assembled = true;
      propsGroup.visible = true;
      document.getElementById('hintText').textContent = T.ui.hint;
      hintEl.classList.add('show');
      setTimeout(()=>hintEl.classList.remove('show'), 7000);
    } else {
      hintEl.classList.add('show');
    }
  }

  // 2) ลอยเบาๆ + กล้อง parallax ช้าๆ
  if(assembled && !reduced){
    let i=0;
    for(const p of Object.values(parts)){
      const dy = Math.sin(el*0.8 + i*1.7)*0.012;
      p.group.position.y = p.home.y + dy; i++;
    }
  }
  const px = mouse.x*0.55, py = mouse.y*0.3;
  camera.position.x += (CAM_BASE.x + px + (reduced?0:Math.sin(el*.12)*.25) - camera.position.x)*.04;
  camera.position.y += (CAM_BASE.y - py + (reduced?0:Math.cos(el*.09)*.15) - camera.position.y)*.04;
  camera.position.z += (CAM_BASE.z - camera.position.z)*.04;
  camera.lookAt(0.4, 1.3, 0);

  // 3) hover (desktop เท่านั้น — มือถือใช้ระบบแตะ)
  if(assembled && !isTouch){
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(root.children, true)[0];
    const id = hit && hit.object.userData.pid || null;
    if(id !== hoverId){
      if(hoverId) setHighlight(hoverId, false);
      hoverId = id;
      if(id){ setHighlight(id, true); showTip(id); document.body.style.cursor='pointer'; }
      else { hideTip(); document.body.style.cursor='default'; }
    } else if(id){
      showTip(id);          // อัปเดตตำแหน่งเส้นโยงตามกล้องที่ขยับ
    }
  }
  if(assembled && isTouch && lockId) showTip(lockId);

  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
